[project]
name = "sunday-solar-engine"
version = "0.1.0"
description = "Sunday's solar physics sidecar: pvlib-backed PV modelling over a local HTTP API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pvlib>=0.11",
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sunday_solar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
